name: Profile

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Verify profile contract
        run: |
          test -s README.md
          grep -Fq '## Hi there' README.md
          grep -Fq '**kilbertert/kilbertert** is a ✨ _special_ ✨ repository' README.md
          test "$(grep -Ec 'https?://|<img' README.md)" -eq 0
